project:
  name: competitive-intel-mx
  default_locale: es-MX
  timezone: America/Mexico_City

platforms:
  enabled:
    - rappi
    - uber_eats
    - didi_food

outputs:
  export_format: jsonl
  encoding: utf-8

scraping:
  request_timeout_seconds: 30
  max_retries: 2
  delay_seconds: 2
  delay_jitter_seconds: 1.5
  between_locations_seconds: 4
  between_platforms_seconds: 8
  navigation_timeout_ms: 45000
  headless: true
  rappi:
    menu_items_limit: 10
    # Pausa entre cadenas (rate limiting); bajar con cuidado si Rappi limita requests.
    between_chains_seconds: 4
    # Overrides opcionales; más bajo = scrape más rápido (riesgo en redes lentas).
    delay_seconds: 1
    delay_jitter_seconds: 0.8
    chains:
      - McDonald's
      - Little Caesars
      - KFC
      - Subway
      - Burger King

metrics:
  collect:
    - product_price
    - delivery_fee
    - service_fee
    - estimated_delivery_minutes
    - active_discounts
    - availability
    - total_checkout_price
